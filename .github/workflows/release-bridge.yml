name: Release cloud-bridge

on:
  push:
    branches: [ java ]
    paths:
      - 'cloud-bridge/pom.xml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          server-id: github-pocketcloud
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(mvn -f cloud-bridge/pom.xml -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "bridge-${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (with dependencies)
        if: steps.check.outputs.exists == 'false'
        run: mvn -B -pl cloud-bridge -am install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate built jar
        if: steps.check.outputs.exists == 'false'
        id: jar
        run: |
          find target -name '*.jar' -type f | head -20 || true
          ls -la target/cloud-bridge/compiled/ 2>/dev/null || true
          
          JAR="target/cloud-bridge/compiled/cloudbridge.jar"
          
          if [ ! -f "$JAR" ]; then
            echo "::error::JAR not found at $JAR"
            exit 1
          fi
          
          echo "Found JAR: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create versioned release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-${{ steps.version.outputs.version }}
          name: cloud-bridge ${{ steps.version.outputs.version }}
          files: ${{ steps.jar.outputs.path }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          make_latest: false

      - name: Move latest-bridge tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -f latest-bridge
          git push origin latest-bridge --force

      - name: Update latest-bridge release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bridge
          name: "cloud-bridge latest (${{ steps.version.outputs.version }})"
          files: ${{ steps.jar.outputs.path }}
          target_commitish: ${{ github.sha }}
          make_latest: false